[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cppn-art"
version = "0.1.0"
description = "Generate infinite unique fractal artwork using Compositional Pattern Producing Networks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LeonFXD200", email = "leonfxdupree@googlemail.com" }]
keywords = ["generative-art", "neural-networks", "fractals", "cppn", "art", "creative-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cppn-art = "cppn_art.cli:main"

[project.urls]
Homepage = "https://github.com/LeonFXD200/cppn-art"
Repository = "https://github.com/LeonFXD200/cppn-art"
"Bug Tracker" = "https://github.com/LeonFXD200/cppn-art/issues"

[tool.setuptools.packages.find]
include = ["cppn_art*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
